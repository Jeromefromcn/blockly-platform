services:
  db:
    image: mysql:8.0
    container_name: blockly_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: blocklydb
      MYSQL_USER: blockly
      MYSQL_PASSWORD: blockly123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blockly_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ublockly", "-pblockly123"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend:
    build: ./backend
    container_name: blockly_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: blocklydb
      DB_USER: blockly
      DB_PASS: blockly123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blockly_net

  frontend:
    build: ./frontend
    container_name: blockly_frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - blockly_net

  prometheus:
    image: prom/prometheus:latest
    container_name: blockly_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - blockly_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    container_name: blockly_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - blockly_net

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  blockly_net:
    driver: bridge
